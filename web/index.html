<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Homs Map</title>
<link href="maplibre-gl.css" rel="stylesheet"/>
<script src="maplibre-gl.js"></script>
<style>body{margin:0}#map{height:100vh}</style>
</head>
<body>
<div id="map"></div>
<script>
maplibregl.setRTLTextPlugin(
  'https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js'
);

const T = 'http://localhost:7800/public.';
const BUILDING_MINZOOM = 16;   // Change Based On What Looks Right
const MAIN_POI = ['mosque','hospital','university','college','school','bank','pharmacy','police','townhall','bus_station'];
// [Name, Road Types, Road Color, Base Width, Border Color]
const ROAD_COLOR = '#d5dce3', CASING_COLOR = '#cbd3db';
const ROADS = [
  ['minor',     ['residential','service','unclassified','living_street','track'], ROAD_COLOR, 3, CASING_COLOR, 13],
  ['tertiary',  ['tertiary','tertiary_link'],                                     ROAD_COLOR, 4, CASING_COLOR, 13],
  ['secondary', ['secondary','secondary_link'],                                   ROAD_COLOR, 5, CASING_COLOR, 11],
  ['primary',   ['primary','primary_link'],                                       ROAD_COLOR, 6, CASING_COLOR, 0],
  ['trunk',     ['trunk','trunk_link','motorway','motorway_link'],                ROAD_COLOR, 7, CASING_COLOR, 0]
];

// Line Width Increases With Zoom Up To 22
const width = (w) => ['interpolate', ['exponential', 1.6], ['zoom'],
  12, w * 0.4, 15, w * 1.2, 17, w * 2.5, 19, w * 6, 22, w * 28];

const roadLayer = (id, classes, color, w, minzoom) => ({
  id, type: 'line', source: 'lines', 'source-layer': 'public.planet_osm_line',
  filter: ['in', ['get', 'highway'], ['literal', classes]],
  minzoom,
  layout: {'line-cap': 'round', 'line-join': 'round'},
  paint: {'line-color': color, 'line-width': width(w)}
});
// Named Or General OSM Buildings Are Cream; The Rest Are Gray
const NAMED = ['any', ['has', 'name'],
  ['in', ['get', 'building'], ['literal',
    ['commercial','retail','public','civic','mosque','church','hotel']]]];

const MAJOR = ['primary','primary_link','secondary','secondary_link','trunk','trunk_link','motorway','motorway_link'];
const TEXT_SIZE = ['interpolate', ['linear'], ['zoom'], 13, 10, 18, 15];
const TEXT_PAINT = {'text-color': '#5f6b78', 'text-halo-color': '#ffffff', 'text-halo-width': 1.5};
const TEXT_FIELD = ['coalesce', ['get', 'name:ar'], ['get', 'name']];

const map = new maplibregl.Map({
  container: 'map',
  center: [36.72, 34.73],
  zoom: 13,
  maxZoom: 22,
  style: {
    version: 8,
    glyphs: location.origin + '/fonts/{fontstack}/{range}.pbf',
    sources: {
      lines:    {type: 'vector', tiles: [T + 'planet_osm_line/{z}/{x}/{y}.pbf'],
                 attribution: '© OpenStreetMap'},
      polys:    {type: 'vector', tiles: [T + 'planet_osm_polygon/{z}/{x}/{y}.pbf']},
      points:   {type: 'vector', tiles: [T + 'planet_osm_point/{z}/{x}/{y}.pbf']},
      overture: {type: 'vector', tiles: [T + 'overture_buildings/{z}/{x}/{y}.pbf'],
                 attribution: '© Overture Maps'}
    },
    layers: [
      {id: 'bg', type: 'background', paint: {'background-color': '#f3f3f3'}},

      {id: 'landuse', type: 'fill', source: 'polys', 'source-layer': 'public.planet_osm_polygon',
       filter: ['any',
         ['in', ['get', 'landuse'], ['literal', ['forest','grass','meadow','recreation_ground','cemetery','village_green']]],
         ['in', ['get', 'leisure'], ['literal', ['park','garden','pitch','playground']]]],
       paint: {'fill-color': '#c8e6c9'}},

      {id: 'water', type: 'fill', source: 'polys', 'source-layer': 'public.planet_osm_polygon',
       filter: ['==', ['get', 'natural'], 'water'],
       paint: {'fill-color': '#a0c8f0'}},

      {id: 'waterway', type: 'line', source: 'lines', 'source-layer': 'public.planet_osm_line',
       filter: ['has', 'waterway'],
       paint: {'line-color': '#a0c8f0', 'line-width': 2}},

      // Overture Buildings (Gray) Under OSM Buildings
      {id: 'overture-buildings', type: 'fill', source: 'overture',
       'source-layer': 'public.overture_buildings', minzoom: BUILDING_MINZOOM,
       paint: {'fill-color': '#e1e1e4', 'fill-outline-color': '#d6d6da'}},

      {id: 'buildings', type: 'fill', source: 'polys', 'source-layer': 'public.planet_osm_polygon',
       filter: ['has', 'building'], minzoom: BUILDING_MINZOOM,
       paint: {
         'fill-color': ['case', NAMED, '#fdf5e4', '#e1e1e4'],
         'fill-outline-color': ['case', NAMED, '#f3e6c8', '#d6d6da']
       }},

      ...ROADS.map(r => roadLayer(r[0] + '-casing', r[1], r[4], r[3] * 1.35, r[5])),
      ...ROADS.map(r => roadLayer(r[0], r[1], r[2], r[3], r[5])),

      // Major Street Names: From Far Away
      {id: 'road-names-major', type: 'symbol', source: 'lines', 'source-layer': 'public.planet_osm_line',
       filter: ['all', ['has', 'name'], ['in', ['get', 'highway'], ['literal', MAJOR]]], minzoom: 13,
       layout: {'symbol-placement': 'line', 'text-field': TEXT_FIELD,
                'text-font': ['Noto Sans Regular'], 'text-size': TEXT_SIZE},
       paint: TEXT_PAINT},

      // Minor Street Names: Up Close
      {id: 'road-names-minor', type: 'symbol', source: 'lines', 'source-layer': 'public.planet_osm_line',
       filter: ['all', ['has', 'highway'], ['has', 'name'], ['!', ['in', ['get', 'highway'], ['literal', MAJOR]]]], minzoom: 16,
       layout: {'symbol-placement': 'line', 'text-field': TEXT_FIELD,
                'text-font': ['Noto Sans Regular'], 'text-size': TEXT_SIZE},
       paint: TEXT_PAINT},

      // Neighborhood And Area Names: From Far Away
      {id: 'place-areas', type: 'symbol', source: 'points', 'source-layer': 'public.planet_osm_point',
      filter: ['in', ['get', 'place'], ['literal', ['city','town','suburb','neighbourhood','quarter','village']]],
      minzoom: 11, maxzoom: 17,
      layout: {'text-field': TEXT_FIELD, 'text-font': ['Noto Sans Regular'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 11, 12, 16, 16]},
      paint: TEXT_PAINT},

      // Important Places (Mosque, Hospital, University...): From Zoom 15
      {id: 'poi-main', type: 'symbol', source: 'points', 'source-layer': 'public.planet_osm_point',
      filter: ['all', ['has', 'name'], ['in', ['get', 'amenity'], ['literal', MAIN_POI]]],
      minzoom: 15,
      layout: {'text-field': TEXT_FIELD, 'text-font': ['Noto Sans Regular'], 'text-size': TEXT_SIZE},
      paint: TEXT_PAINT},

      // Other Places (Shops And More): Up Close Only
      {id: 'poi-minor', type: 'symbol', source: 'points', 'source-layer': 'public.planet_osm_point',
      filter: ['all', ['has', 'name'], ['!', ['has', 'place']],
                ['!', ['in', ['get', 'amenity'], ['literal', MAIN_POI]]]],
      minzoom: 17,
      layout: {'text-field': TEXT_FIELD, 'text-font': ['Noto Sans Regular'], 'text-size': TEXT_SIZE},
      paint: TEXT_PAINT}
    ]
  }
});
map.addControl(new maplibregl.NavigationControl());
</script>
</body>
</html>
